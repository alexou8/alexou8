name: Refresh profile README

on:
  schedule:
    # 04:00 UTC daily, so the card is current before the morning.
    - cron: "0 4 * * *"
  push:
    branches: [main]
    # Only rebuild when the generator itself changes.  The bot's own commits
    # touch the SVGs and cache, which must not trigger another run.
    paths:
      - "profilecard/**"
      - "generate_svg.py"
      - "requirements.txt"
      - ".github/workflows/update-readme.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-readme
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate profile cards
        env:
          # A fine-grained PAT in the ACCESS_TOKEN secret unlocks the full
          # stat set.  Without it the run falls back to the built-in
          # GITHUB_TOKEN, which cannot read star counts or language bytes on
          # other repositories — the job still succeeds and reuses the last
          # known values, and annotates the run explaining why.
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          USER_NAME: ${{ secrets.USER_NAME || github.repository_owner }}
        run: python generate_svg.py

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # cache/ is committed on purpose: it carries the per-repository
          # line counts and the last known good stats, which is what lets a
          # degraded run render yesterday's numbers instead of zeroes.
          git add dark_mode.svg light_mode.svg cache/

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "chore: refresh profile cards [skip ci]"

          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt), rebasing and retrying..."
            sleep $((2 ** attempt))
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done

          echo "::error::Could not push the refreshed cards."
          exit 1
